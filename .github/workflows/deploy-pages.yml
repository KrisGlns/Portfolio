name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Blazor WebAssembly
        run: dotnet publish src/Portfolio.Web/Portfolio.Web.csproj -c Release -o publish

      - name: Rewrite base href for the repository sub-path
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          # A <user>.github.io repository is served from the domain root; everything else from /<repo>/.
          if [[ "$REPO" == *.github.io ]]; then BASE="/"; else BASE="/$REPO/"; fi
          echo "Setting base href to $BASE"
          sed -i "s|<base href=\"/\" />|<base href=\"$BASE\" />|g" publish/wwwroot/index.html

      - name: Prepare for static hosting
        run: |
          # GitHub Pages has no SPA fallback, so 404s are served the app shell instead.
          cp publish/wwwroot/index.html publish/wwwroot/404.html
          # Stop Jekyll from stripping the _framework directory.
          touch publish/wwwroot/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
